name: CI

on:
  push:
    branches: [ master, twainx ]
  pull_request:
    branches: [ master, twainx ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select product
        id: product
        shell: pwsh
        run: |
          if ($env:TARGET_BRANCH -eq 'twainx') {
            "project=Saraff.TwainX.csproj" >> $env:GITHUB_OUTPUT
            "solution=Saraff.TwainX.sln" >> $env:GITHUB_OUTPUT
            "tests=tests/Saraff.TwainX.Tests/Saraff.TwainX.Tests.csproj" >> $env:GITHUB_OUTPUT
            "package_id=Saraff.TwainX" >> $env:GITHUB_OUTPUT
          } else {
            "project=Saraff.Twain.NET.csproj" >> $env:GITHUB_OUTPUT
            "solution=Saraff.Twain.sln" >> $env:GITHUB_OUTPUT
            "tests=tests/Saraff.Twain.Tests/Saraff.Twain.Tests.csproj" >> $env:GITHUB_OUTPUT
            "package_id=Saraff.Twain" >> $env:GITHUB_OUTPUT
          }
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build '${{ steps.product.outputs.solution }}' -c Release
          dotnet test '${{ steps.product.outputs.tests }}' -c Release --no-build
      - name: Validate package identity and version
        shell: pwsh
        run: |
          $project = '${{ steps.product.outputs.project }}'
          $expected = '${{ steps.product.outputs.package_id }}'
          $packageId = (dotnet msbuild $project -getProperty:PackageId | Select-Object -Last 1).Trim()
          $version = (dotnet msbuild $project -getProperty:Version | Select-Object -Last 1).Trim()
          if ($packageId -ne $expected) {
            throw "Unexpected package id '$packageId' in project '$project'; expected '$expected'."
          }
          Write-Output "Package identity: $packageId $version"

          $packages = @(Get-ChildItem -Path 'bin/Release' -Filter "$expected.*.nupkg" -File |
              Where-Object { $_.Name -notlike '*.snupkg' })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one $expected .nupkg in bin/Release, found $($packages.Count)."
          }

          ./scripts/verify-package-version.ps1 -PackagePath $packages[0].FullName -PackageId $expected -Version $version

  package-identities:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          path: master
      - uses: actions/checkout@v4
        with:
          ref: twainx
          path: twainx
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify shared sources are identical
        shell: pwsh
        run: |
          Get-ChildItem master/Shared/*.cs | ForEach-Object {
            $other = Join-Path "twainx/Shared" $_.Name
            if (-not (Test-Path $other)) {
              throw "Shared file '$($_.Name)' is missing from the twainx branch."
            }
            if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash $other).Hash) {
              throw "Shared file '$($_.Name)' differs between master and twainx."
            }
          }
          Write-Output "Shared sources are identical."
      - name: Compare package identities
        shell: pwsh
        run: |
          $masterId = (dotnet msbuild master/Saraff.Twain.NET.csproj -getProperty:PackageId | Select-Object -Last 1).Trim()
          $masterVersion = (dotnet msbuild master/Saraff.Twain.NET.csproj -getProperty:Version | Select-Object -Last 1).Trim()
          $twainxId = (dotnet msbuild twainx/Saraff.TwainX.csproj -getProperty:PackageId | Select-Object -Last 1).Trim()
          $twainxVersion = (dotnet msbuild twainx/Saraff.TwainX.csproj -getProperty:Version | Select-Object -Last 1).Trim()
          Write-Output "master:  $masterId $masterVersion"
          Write-Output "twainx:  $twainxId $twainxVersion"
          if ($masterId -eq $twainxId) {
            throw "Package id collision: both branches use '$masterId'."
          }
