name: CI

on:
  push:
    branches: [ master, twainx ]
  pull_request:
    branches: [ master, twainx ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "twainx") {
            dotnet build Saraff.TwainX.sln -c Release
            dotnet test tests/Saraff.TwainX.Tests/Saraff.TwainX.Tests.csproj -c Release --no-build
          } else {
            dotnet build Saraff.Twain.sln -c Release
            dotnet test tests/Saraff.Twain.Tests/Saraff.Twain.Tests.csproj -c Release --no-build
          }
      - name: Validate package identity
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "twainx") {
            $project = "Saraff.TwainX.csproj"
            $expected = "Saraff.TwainX"
          } else {
            $project = "Saraff.Twain.NET.csproj"
            $expected = "Saraff.Twain"
          }
          $packageId = (dotnet msbuild $project -getProperty:PackageId | Select-Object -Last 1).Trim()
          $version = (dotnet msbuild $project -getProperty:Version | Select-Object -Last 1).Trim()
          if ($packageId -ne $expected) {
            throw "Unexpected package id '$packageId' in project '$project'; expected '$expected'."
          }
          Write-Output "Package identity: $packageId $version"

  package-identities:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          path: master
      - uses: actions/checkout@v4
        with:
          ref: twainx
          path: twainx
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify shared sources are identical
        shell: pwsh
        run: |
          Get-ChildItem master/Shared/*.cs | ForEach-Object {
            $other = Join-Path "twainx/Shared" $_.Name
            if (-not (Test-Path $other)) {
              throw "Shared file '$($_.Name)' is missing from the twainx branch."
            }
            if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash $other).Hash) {
              throw "Shared file '$($_.Name)' differs between master and twainx."
            }
          }
          Write-Output "Shared sources are identical."
      - name: Compare package identities
        shell: pwsh
        run: |
          $masterId = (dotnet msbuild master/Saraff.Twain.NET.csproj -getProperty:PackageId | Select-Object -Last 1).Trim()
          $masterVersion = (dotnet msbuild master/Saraff.Twain.NET.csproj -getProperty:Version | Select-Object -Last 1).Trim()
          $twainxId = (dotnet msbuild twainx/Saraff.TwainX.csproj -getProperty:PackageId | Select-Object -Last 1).Trim()
          $twainxVersion = (dotnet msbuild twainx/Saraff.TwainX.csproj -getProperty:Version | Select-Object -Last 1).Trim()
          Write-Output "master:  $masterId $masterVersion"
          Write-Output "twainx:  $twainxId $twainxVersion"
          if ($masterId -eq $twainxId) {
            throw "Package id collision: both branches use '$masterId'."
          }
